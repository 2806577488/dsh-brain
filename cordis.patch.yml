# DSH 助手大脑（dsh-brain）：bundle 层。
#
# 一个包、四个独立 Host 插件行，可单独 enable/disable，各有自己的 config：
#   dsh-memory   记忆层：双向长期记忆（user 侧=关于用户 / self 侧=关于助手自己）
#   dsh-mood     情绪层：双向情绪状态机（用户状态 / 助手状态 + 好感度）
#   dsh-persona  人格收集层：双向倾向（用户沟通风格 / 助手表达倾向）
#   dsh-context  工作记忆层（当前上下文）：决定这一轮看到什么 —— 召回 + 归档 + /brain
#
# 数据默认写在 %USERPROFILE%\.dsh\dsh-brain\；不监听端口、不依赖桌宠。
# 这一层在 dsh-base 之后、用户 cordis.patch.yml 之前应用；用户可用同一行 id 覆盖
# config（后应用者优先，config 整段替换，所以要把需要的字段写全）。
- insert:
    - id: dsh-memory
      name: '@shenyue/dsh-brain/plugins/memory'
      config:
        dataDir: ''
        dbFile: ''
        enabled: true
        maxTurns: 60
        summaryThreshold: 24
        summaryEnabled: true
        factExtractInterval: 3
        factExtractMode: rule
        maxFactsPerSide: 80
        maxFactChars: 60
        writeMarkdown: true
        # v2.1.0：召回自学习（默认开；false 一键关闭，不写任何 recall_* 表）
        recallLearningEnabled: true
        recallLearningMode: rule
        recallLearningRate: 0.05
        recallUsefulnessAlpha: 0.3
        recallFeatureRate: 0.05
        recallWeightDecayPerDay: 0.95
        recallMissBoost: 1.5
        collectSubagents: false
        excludeSessionIdPattern: pet
        includeSessions: []
        maxTextChars: 20000
        minTextChars: 2
        # v2.1.0：系统/工具事件只在 true 时落 memory_events（默认只隔离不存）
        includeSystemEvents: false

    - id: dsh-mood
      name: '@shenyue/dsh-brain/plugins/mood'
      config:
        dataDir: ''
        dbFile: ''
        enabled: true
        moodDecayMinutes: 120
        historyLimit: 30
        deepNightEnergyPenalty: 0.05
        deepNightValencePenalty: 0.02
        collectSubagents: false
        excludeSessionIdPattern: pet
        includeSessions: []
        maxTextChars: 20000
        minTextChars: 2

    - id: dsh-persona
      name: '@shenyue/dsh-brain/plugins/persona'
      config:
        dataDir: ''
        dbFile: ''
        enabled: true
        dynamicsEnabled: true
        baselineUser:
          directness: 0.5
          pace: 0.5
          humor: 0.4
          detail: 0.5
        baselineSelf:
          warmth: 0.6
          directness: 0.55
          playfulness: 0.4
          proactivity: 0.5
        regressionPerDaySelf: 0.3
        regressionPerDayUser: 0.12
        collectSubagents: false
        excludeSessionIdPattern: pet
        includeSessions: []
        maxTextChars: 20000
        minTextChars: 2

    - id: dsh-context
      name: '@shenyue/dsh-brain/plugins/context'
      config:
        dataDir: ''
        enabled: true
        userName: 用户
        agentName: 助手
        maxChars: 1800
        factLimit: 6
        workingMemoryMaxChars: 1200
        recallMaxChars: 1200
        recallLimit: 4
        turnRecallLimit: 3
        recallCooldownTurns: 3
        topicShiftEnabled: true
        recallTopicTurns: 2
        includeUser: true
        includeSelf: true
        sectionOrder: 100
        commandEnabled: true
        debugSection: false
        # v2.2.0：域角色层（**通用**）。插件不绑定任何领域——这里默认关闭，
        # 要启用就把 roleEnabled 改成 true，并把 role 填成你的领域。
        # 现成配方（整段贴到本行 config 下即可）：
        #   examples/profiles/tcm.yml          中医临床
        #   examples/profiles/code-review.yml  代码评审
        # 校验方式：node tools/render-profile.mjs examples/profiles/tcm.yml
        roleEnabled: false
        roleSectionOrder: 90
        role: {}
        # 归档：只对当前 lead 会话开启（其它会话仍关闭）；DSH compaction 保留为安全网
        # v2.3.0 实体层：后台整理时抽「患者/客户/项目」，本轮提到的对象优先注入。
        entityEnabled: true
        entityLimit: 2
        entityMaxChars: 400
        entityFactLimit: 6
        entityTurnLimit: 3
        # 激活扩散 + 表意识槽位（"他今天怎么样"也能接上）
        entitySpreadEnabled: true
        entityFocusTtlMinutes: 30
        # 睡眠期结构化巩固：llm = 后台低频抽「主诉/辨证/处方/复诊」字段；
        # 想省 token 就改回 rule（只存原话片段），off 则完全不抽。
        entityExtractMode: llm
        archiveEnabled: true
        archiveAtPercent: 0.05
        keepRecentTurns: 4
        archiveMaxTurnsPerBatch: 8
        archiveMarker: oneline
        archiveSessionIds:
          - session-36ba2998-843a-4171-8bab-d4b2d274d6d5
        archiveDryRun: false
        # 后台消化（把会话静默压入长期记忆；只读会话，不写会话、不压缩）
        consolidateEnabled: true
        consolidateEveryTurns: 4
        idleConsolidateMs: 90000
        consolidateMode: rule
        consolidateMaxTurns: 12
        consolidateMinTurns: 1
        consolidateEpisodeMaxChars: 160
        summaryAppendMaxChars: 600
        debugConsolidate: false





